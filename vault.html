<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT // HOLY</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#05070A;color:#F5F7FA;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:64px 24px 90px}
.k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.22em;color:#FFB020;border:1px solid rgba(255,176,32,.4);display:inline-block;padding:7px 14px;border-radius:6px;margin-bottom:20px}
h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.03em;margin:0 0 8px;font-weight:900}
h1 span{color:#FFB020}
.sub{color:#7C8794;max-width:62ch}
h2{font-size:19px;margin:36px 0 8px;color:#FFD88A}
p,li{color:#c6cfd8;font-size:15px}
ul{padding-left:20px}
.card{background:#10161D;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px;margin:16px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.wp{border-radius:12px;min-height:130px;display:flex;align-items:flex-end;padding:12px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.14em;border:1px solid rgba(255,255,255,.1)}
input{background:#10161D;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#F5F7FA;padding:13px 15px;font-family:ui-monospace,monospace;font-size:14px;width:100%}
input:focus{outline:1px solid #FFB020}
button{background:#FFB020;color:#0a0800;border:none;border-radius:10px;padding:13px 20px;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;font-weight:800;cursor:pointer;margin-top:12px}
a{color:#FFD88A}
.trophy{font-family:ui-monospace,monospace;font-size:13px;line-height:2.1}
.back{display:inline-block;margin-top:34px;font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:.1em;text-decoration:none;background:#FF3355;color:#0a0507;font-weight:800;padding:14px 26px;border-radius:10px}
.err{color:#FF3B30;font-family:ui-monospace,monospace;font-size:12.5px;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="vault.js"></script>
</body>
</html>
